<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database browser</title>
<style>
:root {
	--paper: #f4f4f3; --panel: #fff; --paper-2: #e9e8e6; --ink: #1b1a19; --muted: #625f5b; --rule: #d6d4d0; --rule-soft: #e6e4e1;
	--action: #b44718; --action-ink: #fff; --fail: #b33929; --run: #076c5c; --warn: #905600; --term: #161517; --term-ink: #e4e2e0;
	--radius: 6px; --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	--mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
	--ease: cubic-bezier(0.2, 0.7, 0.3, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 var(--font); color: var(--ink); background: var(--panel); overflow: hidden; }
::selection { background: color-mix(in srgb, var(--action) 24%, transparent); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
* { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }

/* Frame */
.app { height: 100%; display: grid; grid-template-columns: 16.5rem minmax(0, 1fr); }
.side { background: var(--paper); border-right: 1px solid var(--rule-soft); display: flex; flex-direction: column; min-height: 0; }
.side section { padding: 12px 10px 10px; }
.side section + section { border-top: 1px solid var(--rule-soft); flex: 1; min-height: 0; display: flex; flex-direction: column; }
.side h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 6px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.side h2 .count { font-weight: 400; font-variant-numeric: tabular-nums; }
.side ul { list-style: none; margin: 0; padding: 0; }
.objects-list { overflow: auto; flex: 1; min-height: 0; margin: 0 -4px; padding: 0 4px; }
.item { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 5px 8px; border-radius: var(--radius); min-height: 30px; transition: background-color 150ms var(--ease); }
.item:hover { background: color-mix(in srgb, var(--paper-2) 70%, transparent); }
.item[aria-current="true"] { background: var(--panel); box-shadow: 0 1px 2px rgb(20 18 16 / 0.08), 0 0 0 1px var(--rule-soft); }
.item[aria-current="true"] .i { color: var(--action); }
.item .i { color: var(--muted); }
.item .txt { min-width: 0; display: flex; flex-direction: column; }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.obj .name { font-family: var(--mono); font-size: 13px; }
.filter { position: relative; margin: 0 0 6px; }
.filter .i { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 14px; height: 14px; }
.filter input { width: 100%; padding: 5px 8px 5px 28px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); font-size: 13px; }
.side .hint { font-size: 12px; color: var(--muted); padding: 4px 6px; }
.skel { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--paper-2), color-mix(in srgb, var(--paper-2) 40%, transparent), var(--paper-2)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; margin: 10px 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } * { transition: none !important; } }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px 0; border-bottom: 1px solid var(--rule-soft); }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; padding-bottom: 10px; font-weight: 600; }
.crumb .seg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb .seg.mono { font-weight: 500; }
.crumb .sep { color: var(--muted); width: 14px; height: 14px; }
.crumb .tag { font-weight: 400; font-size: 12px; color: var(--muted); white-space: nowrap; }
.tabs { display: flex; gap: 2px; align-self: flex-end; }
.tab { border: 0; background: transparent; padding: 6px 10px 9px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--action); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--rule-soft); min-height: 46px; }
.bar .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--panel); border-radius: var(--radius); padding: 4px 10px; min-height: 30px; transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
.btn:hover:not(:disabled) { background: var(--paper); border-color: color-mix(in srgb, var(--rule) 60%, var(--ink)); }
.btn.primary { background: var(--action); border-color: var(--action); color: var(--action-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--action) 88%, var(--ink)); border-color: color-mix(in srgb, var(--action) 88%, var(--ink)); }
.btn.change { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--rule)); }
.btn.change:hover:not(:disabled) { background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); background: var(--paper); border-color: transparent; }
.btn.icon { padding: 4px 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.kbd { font-size: 12px; color: var(--muted); }
kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
select, input[type=text], textarea { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); padding: 5px 8px; min-height: 30px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 0; border-color: var(--action); box-shadow: 0 0 0 3px color-mix(in srgb, var(--action) 18%, transparent); }
.editor { padding: 12px 14px; border-bottom: 1px solid var(--rule-soft); display: grid; gap: 8px; }
.editor .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
textarea { width: 100%; min-height: 6.5rem; resize: vertical; font: 13px/1.55 var(--mono); tab-size: 2; }
input.code { font: 13px var(--mono); }
.guard { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.guard .i { width: 14px; height: 14px; color: var(--run); }

.meta { display: flex; align-items: center; gap: 12px; padding: 6px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--rule-soft); font-variant-numeric: tabular-nums; min-height: 38px; }
.meta .grow { flex: 1; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--paper-2); color: var(--muted); white-space: nowrap; }
.pill.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.pill.ok { background: color-mix(in srgb, var(--run) 12%, transparent); color: var(--run); }

.out { flex: 1; min-height: 0; overflow: auto; }
table { border-collapse: separate; border-spacing: 0; font: 12.5px/1.4 var(--mono); min-width: 100%; }
th, td { border-bottom: 1px solid var(--rule-soft); padding: 5px 12px; text-align: left; vertical-align: top; white-space: nowrap; max-width: 28rem; overflow: hidden; text-overflow: ellipsis; }
th { position: sticky; top: 0; background: var(--paper); font-weight: 600; z-index: 1; font-family: var(--font); font-size: 12px; color: var(--ink); }
th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th button:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 2px; }
th .i { width: 12px; height: 12px; color: var(--muted); }
th.sorted .i { color: var(--action); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
th.n button { flex-direction: row-reverse; }
td.null { color: var(--muted); font-style: italic; }
td.idx, th.idx { color: var(--muted); text-align: right; width: 1%; padding-right: 8px; font-variant-numeric: tabular-nums; position: sticky; left: 0; background: var(--panel); border-right: 1px solid var(--rule-soft); }
th.idx { background: var(--paper); z-index: 2; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--paper) 80%, transparent); }
tbody tr[aria-selected="true"] td { background: color-mix(in srgb, var(--action) 8%, var(--panel)); }
pre.text { margin: 0; padding: 14px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }

.state { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; }
.state > div { max-width: 30rem; display: grid; gap: 8px; justify-items: center; }
.state .i { width: 28px; height: 28px; color: var(--muted); stroke-width: 1.25; }
.state h3 { margin: 4px 0 0; font-size: 15px; }
.state p { margin: 0; color: var(--muted); }
.state.fail .i, .state.fail h3 { color: var(--fail); }
.state.fail p { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.loading { padding: 4px 0; }
.loading .skel { margin: 12px 14px; }

.detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(26rem, 100%); background: var(--panel); border-left: 1px solid var(--rule-soft); box-shadow: -12px 0 32px -16px rgb(20 18 16 / 0.25); display: flex; flex-direction: column; z-index: 5; animation: slide 200ms var(--ease); }
@keyframes slide { from { transform: translateX(16px); opacity: 0; } }
.detail header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--rule-soft); }
.detail header h3 { margin: 0; font-size: 14px; flex: 1; }
.detail dl { margin: 0; overflow: auto; flex: 1; padding: 6px 0 14px; }
.detail .field { padding: 8px 14px; border-bottom: 1px solid var(--rule-soft); }
.detail dt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.detail dt span { flex: 1; font-weight: 600; color: var(--ink); }
.detail dd { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 16rem; overflow: auto; }
.detail dd.null { color: var(--muted); font-style: italic; }

@media (max-width: 720px) {
	.app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
	.side { border-right: 0; border-bottom: 1px solid var(--rule-soft); max-height: 44vh; overflow: hidden; }
	.side section { padding: 8px 8px 6px; }
	#sources { max-height: 7.5rem; overflow: auto; }
	.side section + section { flex: 1; }
	.head { padding-top: 8px; }
	.crumb { flex-basis: 100%; padding-bottom: 0; }
	.tabs { width: 100%; }
	.lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
	.bar, .meta, .editor { padding-left: 10px; padding-right: 10px; }
	.hint-row { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<symbol id="i-db" viewBox="0 0 16 16"><ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9"/><path d="M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></symbol>
	<symbol id="i-file" viewBox="0 0 16 16"><path d="M9.5 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5z"/><path d="M9.5 1.5V5H13"/><path d="M5.5 8.5h5M5.5 11h3"/></symbol>
	<symbol id="i-key" viewBox="0 0 16 16"><circle cx="5" cy="11" r="2.5"/><path d="m6.8 9.2 6.7-6.7M11 4.5l1.5 1.5"/></symbol>
	<symbol id="i-table" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M2 6h12M2 9.5h12M6.5 6v7.5"/></symbol>
	<symbol id="i-cols" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M6 2.5v11M10 2.5v11"/></symbol>
	<symbol id="i-code" viewBox="0 0 16 16"><path d="m5.5 4.5-3.5 3.5 3.5 3.5M10.5 4.5l3.5 3.5-3.5 3.5"/></symbol>
	<symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></symbol>
	<symbol id="i-chev" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></symbol>
	<symbol id="i-left" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></symbol>
	<symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3.5M4 7.5l4-4 4 4"/></symbol>
	<symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v9.5M4 8.5l4 4 4-4"/></symbol>
	<symbol id="i-sort" viewBox="0 0 16 16"><path d="m5 6 3-3 3 3M5 10l3 3 3-3"/></symbol>
	<symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></symbol>
	<symbol id="i-x" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
	<symbol id="i-lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></symbol>
	<symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2 1.5 13.5h13z"/><path d="M8 6.5v3.2M8 11.6v.1"/></symbol>
	<symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 3v10l8-5z"/></symbol>
	<symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.5 2.5 13.5 5.5 6 13H3v-3z"/></symbol>
</svg>
<div class="app">
	<aside class="side" aria-label="Databases and tables">
		<section>
			<h2 id="srcTitle">Databases</h2>
			<ul id="sources" aria-labelledby="srcTitle"><li><div class="skel" style="width:70%"></div><div class="skel" style="width:50%"></div></li></ul>
		</section>
		<section id="objSection" hidden>
			<h2><span id="objTitle">Tables</span><span class="count" id="objCount"></span></h2>
			<div class="filter" id="filterWrap" hidden><svg class="i"><use href="#i-search"/></svg><label class="sr" for="filter">Filter</label><input id="filter" type="text" placeholder="Filter" autocomplete="off" spellcheck="false"></div>
			<ul class="objects-list" id="objects"></ul>
		</section>
	</aside>
	<main class="main">
		<header class="head">
			<div class="crumb" id="crumb"><span class="seg">Database browser</span></div>
			<div class="tabs" role="tablist" id="tabs" aria-label="View"></div>
		</header>
		<div id="view"></div>
		<div class="meta" id="meta" hidden></div>
		<div class="out" id="out" tabindex="-1"></div>
		<div class="sr" id="status" role="status" aria-live="polite"></div>
	</main>
</div>
<script>
(() => {
	'use strict';
	const $ = (id) => document.getElementById(id);
	const el = (tag, props = {}, ...kids) => {
		const n = document.createElement(tag);
		for (const [k, v] of Object.entries(props)) {
			if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
			else if (k === 'text') n.textContent = v;
			else if (v !== undefined && v !== false && v !== null) n.setAttribute(k, v === true ? '' : v);
		}
		for (const kid of kids) if (kid != null && kid !== false) n.append(kid);
		return n;
	};
	const icon = (name, cls) => {
		const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
		s.setAttribute('class', 'i' + (cls ? ' ' + cls : '')); s.setAttribute('aria-hidden', 'true');
		const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
		u.setAttribute('href', '#i-' + name); s.append(u);
		return s;
	};

	// Bridge to the panel (this page has an opaque origin and no network).
	let nonce = null, seq = 0;
	const waiting = new Map();
	window.addEventListener('message', (e) => {
		if (e.source !== window.parent) return;
		const m = e.data;
		if (!m || m.rivet !== 1) return;
		if (m.type === 'init' && !nonce) { nonce = m.nonce; theme(m.theme || {}); start(); return; }
		if (m.type === 'theme') { theme(m.theme || {}); return; }
		if (m.type === 'reply' && waiting.has(m.id)) {
			const w = waiting.get(m.id); waiting.delete(m.id);
			m.ok ? w.res(m.body) : w.rej(new Error((m.body && m.body.error && (m.body.error.message || m.body.error)) || 'The request failed.'));
		}
	});
	const call = (type, payload) => new Promise((res, rej) => {
		const id = ++seq; waiting.set(id, { res, rej });
		window.parent.postMessage(Object.assign({ rivet: 1, nonce, id, type }, payload), '*');
	});
	const rpc = (method, path, body) => call('rpc', { method, path, body });
	window.parent.postMessage({ rivet: 1, type: 'ready' }, '*');

	function theme(vars) {
		for (const [k, v] of Object.entries(vars)) if (/^--[a-z0-9-]+$/.test(k) && typeof v === 'string' && v.length < 200) document.documentElement.style.setProperty(k, v);
	}

	const NAMES = { postgres: 'PostgreSQL', mariadb: 'MariaDB', redis: 'Redis', mongodb: 'MongoDB', sqlite: 'SQLite' };
	const SQL = { postgres: true, mariadb: true, sqlite: true };
	const PAGE = 100;

	// State.
	let sources = [], src = null;        // src: { id, kind, label, sub, file }
	let objects = [], obj = '';          // tables, keys or collections of src
	let tab = 'data';
	let offset = 0, sort = null, total = null;
	let result = null, selected = -1, busy = false, mongoDB = '';
	const history = new Map();           // source id -> recent queries
	const drafts = new Map();            // source id -> editor text

	const say = (t) => { $('status').textContent = t || ''; };
	const size = (n) => n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + ' GiB' : n >= 1 << 20 ? (n / (1 << 20)).toFixed(1) + ' MiB' : n >= 1024 ? Math.round(n / 1024) + ' KiB' : n + ' B';
	const fmt = (n) => Number(n).toLocaleString('en-US');
	const qid = (name) => src.kind === 'mariadb' ? '`' + name.replace(/`/g, '``') + '`'
		: name.split('.').length === 2 && src.kind === 'postgres' ? name.split('.').map((p) => '"' + p.replace(/"/g, '""') + '"').join('.')
		: '"' + name.replace(/"/g, '""') + '"';
	const lit = (s) => "'" + s.replace(/'/g, "''") + "'";

	function state(kind, title, text, action) {
		$('out').replaceChildren(el('div', { class: 'state' + (kind === 'fail' ? ' fail' : '') },
			el('div', {}, icon(kind === 'fail' ? 'alert' : kind), el('h3', { text: title }), text ? el('p', { text }) : null, action || null)));
		$('meta').hidden = true;
	}
	const loading = () => { $('out').replaceChildren(el('div', { class: 'loading', 'aria-hidden': 'true' }, ...[90, 70, 80, 60, 75].map((w) => el('div', { class: 'skel', style: `width:${w}%` })))); };

	async function start() {
		let r;
		try {
			r = await rpc('GET', '/addons');
		} catch (e) { renderSources(); return state('fail', 'The databases could not be listed', e.message); }
		if (r.remote) { sources = []; renderSources(); return state('db', 'Not available on remote nodes yet', 'This app runs on a remote node. Browsing its databases there is not supported yet.'); }
		sources = [];
		for (const a of r.addons || []) if (NAMES[a.kind] && a.kind !== 'sqlite') sources.push({ id: a.kind, kind: a.kind, label: NAMES[a.kind], sub: a.name && a.status ? `${a.name} · ${a.status}` : (a.status || 'add-on') });
		for (const f of r.sqlite || []) {
			if (!f || typeof f.path !== 'string') continue;
			const cut = f.path.lastIndexOf('/');
			sources.push({ id: 'sqlite:' + f.path, kind: 'sqlite', file: f.path, label: f.path.slice(cut + 1), sub: (cut > 0 ? f.path.slice(0, cut) + ' · ' : '') + size(f.size || 0) });
		}
		renderSources();
		if (!sources.length) {
			return state('db', 'No databases yet', 'Add PostgreSQL, MariaDB, Redis or MongoDB on the app’s Services tab and start it, or keep a SQLite file (.db, .sqlite, .sqlite3) in its files. It appears here.');
		}
		choose(sources[0]);
	}

	function renderSources() {
		$('sources').replaceChildren(...sources.map((s) => el('li', {}, el('button', {
			class: 'item', type: 'button', 'aria-current': String(src === s), title: s.file || s.label,
			on: { click: () => { if (src !== s) choose(s); } },
		}, icon(s.kind === 'sqlite' ? 'file' : s.kind === 'redis' ? 'key' : 'db'),
			el('span', { class: 'txt' }, el('span', { class: 'name', text: s.label }), el('span', { class: 'sub', text: s.kind === 'sqlite' ? 'SQLite · ' + s.sub : s.sub }))))));

		toast(ok ? `Copied ${what}` : 'Copying is blocked in this frame', ok ? 'success' : 'fail');
	}
	const toast = (text, tone) => window.parent.postMessage({ rivet: 1, nonce, type: 'toast', text: text.slice(0, 200), tone }, '*');
})();
</script>
</body>
</html>
