id: discordts
name: discord.js TypeScript starter
description: Slash-command bot in TypeScript, run directly by Node.js (no compile step), with RivetPanel analytics.
runtime: nodejs
language: TypeScript
sdk: js
argv: [node, src/index.mts]
version: 1
tested_with: "discord.js 14 on Node.js 24 (built-in type stripping)"
first_start: "First start installs npm packages (about a minute). Node.js runs the .mts file directly; type-check locally with npm run check."
privileged_intents: []
env:
  - name: DISCORD_TOKEN
    label: Bot token
    description: "Discord Developer Portal, your application, Bot, Reset Token. Paste it here; it is stored encrypted and never shown in lists."
    secret: true
    required: true
setup:
  - "Create an application at discord.com/developers/applications and open its Bot page."
  - "Reset the token and paste it into DISCORD_TOKEN."
  - "Invite the bot: OAuth2, URL Generator, scopes bot and applications.commands, then open the link."
  - "Start the bot and run /ping in your server."
