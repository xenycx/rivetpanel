id: discordrb
name: discordrb starter
description: Slash-command bot with discordrb (Ruby) and RivetPanel analytics.
runtime: ruby
language: Ruby
sdk: rb
version: 1
tested_with: "discordrb 3.8 on Ruby 4"
first_start: "First start runs bundle install in a build container (a minute or two)."
privileged_intents: []
env:
  - name: DISCORD_TOKEN
    label: Bot token
    description: "Discord Developer Portal, your application, Bot, Reset Token. Paste it here; it is stored encrypted and never shown in lists."
    secret: true
    required: true
setup:
  - "Create an application at discord.com/developers/applications and open its Bot page."
  - "Reset the token and paste it into DISCORD_TOKEN."
  - "Invite the bot: OAuth2, URL Generator, scopes bot and applications.commands, then open the link."
  - "Start the bot and run /ping in your server."
