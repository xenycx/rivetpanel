services:
  app:
    image: searxng/searxng:2026.11.6-ac11e14c5
    user: "977:977"
    ports: ["${APP_PORT}:8080"]
    environment:
      GRANIAN_HOST: "0.0.0.0"
      GRANIAN_PORT: "8080"
    volumes:
      - config:/etc/searxng
      - cache:/var/cache/searxng
    mem_limit: 512m
volumes:
  config: {}
  cache: {}
