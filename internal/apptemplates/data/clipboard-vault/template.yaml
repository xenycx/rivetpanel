id: clipboard-vault
name: Clipboard Vault
tagline: Private vault for pasted text, screenshots and files
description: Paste text and screenshots with Ctrl+V, drop files up to 10 GiB with resumable uploads, and reach everything from the browser, API keys, or a dependency-free Python client.
category: productivity
web: {service: app, port: 8080, health: /health/live}
vars:
  - name: BOOTSTRAP_TOKEN
    label: Setup token
    description: Claims the first administrator account at /setup. Keep it until you have used it.
    secret: true
    credential: true
    generate: {kind: base64url, length: 48}
  - {name: BETTER_AUTH_SECRET, label: Session signing secret, secret: true, advanced: true, generate: {kind: hex, length: 64}}
  - {name: AUTH_BRIDGE_SECRET, label: Internal service secret, secret: true, advanced: true, generate: {kind: hex, length: 64}}
  - {name: DB_PASSWORD, label: Database password, secret: true, advanced: true, generate: {kind: hex, length: 32}}
notes:
  - Open ${APP_URL}/login and create your account, then open ${APP_URL}/setup and paste the setup token shown above. That account becomes the administrator.
  - Under Administration you can close registration, create accounts for other people, and change the default upload limit.
  - Create API keys under Keys and team; each new key offers vault.py, a Python client with the address and key already filled in.
