services:
  app:
    image: ghcr.io/xenycx/clipboard-vault:3.0.1
    user: "10001:10001"
    ports: ["${APP_PORT}:8080"]
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: ${APP_ORIGIN}
      VAULT_SECRET: ${VAULT_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN}
      DATA_DIR: /data
      TRUST_PROXY_HEADERS: "true"
      SERVER_MAX_UPLOAD_BYTES: "10737418240"
      UPLOAD_DISK_RESERVE_BYTES: "2147483648"
      RUST_LOG: clipboard_vault=info,tower_http=warn
    volumes: ["data:/data"]
    mem_limit: 192m
volumes:
  data: {}
