<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#102331" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b0908" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="RivetPanel" />
		<meta property="og:title" content="RivetPanel" />
		<meta property="og:description" content="Run Discord bots and Minecraft servers on this machine." />
		<meta property="og:image" content="/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="RivetPanel: a fleet of Discord bots with their live state" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="RivetPanel" />
		<meta name="twitter:description" content="Run Discord bots and Minecraft servers on this machine." />
		<meta name="twitter:image" content="/og-image.png" />
		<title>RivetPanel</title>
		<script>
			// Apply the saved theme before first paint (see lib/ui/theme.svelte.ts).
			try {
				var t = localStorage.getItem('rivetpanel.theme');
				if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.setAttribute('data-theme', t);
				var a = localStorage.getItem('rivetpanel.accent') || 'ember';
				document.documentElement.setAttribute('data-accent', a);
				document.documentElement.setAttribute('data-radius', localStorage.getItem('rivetpanel.radius') || 'default');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
