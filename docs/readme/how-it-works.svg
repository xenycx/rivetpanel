<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <title>How RivetPanel works: one binary drives Docker on this host and on remote nodes</title>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ea621f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ea621f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rivets" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1815"/>
      <stop offset="1" stop-color="#110e0c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a11"/>
      <stop offset="1" stop-color="#160e0a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa45c"/>
      <stop offset="1" stop-color="#e8561a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="640" fill="#0b0908"/>
  <rect width="1600" height="640" fill="url(#rivets)"/>
  <ellipse cx="800" cy="330" rx="420" ry="300" fill="url(#glow)"/>

  <text x="800" y="64" text-anchor="middle" font-family="IBM Plex Mono" font-weight="500" font-size="17" letter-spacing="3.4" fill="#c2a593">HOW IT FITS TOGETHER</text>

  <!-- Inputs -->
  <g font-family="IBM Plex Sans">
    <rect x="64" y="150" width="300" height="118" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="92" y="196" font-weight="600" font-size="24" fill="#f3ece7">You and your team</text>
    <text x="92" y="228" font-size="18" fill="#a39a93">Browser, SFTP, API clients,</text>
    <text x="92" y="252" font-size="18" fill="#a39a93">Discord ChatOps</text>

    <rect x="64" y="350" width="300" height="118" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="92" y="396" font-weight="600" font-size="24" fill="#f3ece7">GitHub</text>
    <text x="92" y="428" font-size="18" fill="#a39a93">Push to deploy, or poll any</text>
    <text x="92" y="452" font-size="18" fill="#a39a93">public repository</text>
  </g>
  <path d="M372 209 C 430 209, 440 270, 520 286" fill="none" stroke="#c2a593" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M372 409 C 430 409, 440 350, 520 334" fill="none" stroke="#c2a593" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

  <!-- Core -->
  <rect x="528" y="112" width="544" height="420" rx="22" fill="url(#core)" stroke="#f47a3d" stroke-opacity="0.55" stroke-width="1.5"/>
  <g transform="translate(560 142)">
    <rect width="52" height="52" rx="12" fill="#0b0908"/>
    <g transform="translate(-6 -6) scale(1)">
      <path d="M12 19a5 5 0 0 1 5-5h25a5 5 0 0 1 5 5v13H12V19Z" fill="#f3ece7"/>
      <path d="M17 32h35v13a5 5 0 0 1-5 5H17a5 5 0 0 1-5-5V32h5Z" fill="#cfd8dd"/>
      <circle cx="32" cy="32" r="10" fill="url(#metal)" stroke="#0b0908" stroke-width="3"/>
      <circle cx="32" cy="32" r="3" fill="#241b16"/>
    </g>
  </g>
  <text x="630" y="166" font-family="IBM Plex Mono" font-weight="500" font-size="22" fill="#f6efe9">rivetpanel</text>
  <text x="630" y="192" font-family="IBM Plex Sans" font-size="17" fill="#c2a593">one Go binary · ~38 MiB idle</text>

  <g font-family="IBM Plex Sans" font-size="18" fill="#e9e1db">
    <rect x="560" y="226" width="232" height="60" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="582" y="262">Web UI and API</text>
    <rect x="808" y="226" width="232" height="60" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="830" y="262">Reconciler</text>
    <rect x="560" y="302" width="232" height="60" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="582" y="338">SQLite + sealed secrets</text>
    <rect x="808" y="302" width="232" height="60" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="830" y="338">Backups and schedules</text>
    <rect x="560" y="378" width="232" height="60" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="582" y="414">Site host and SFTP</text>
    <rect x="808" y="378" width="232" height="60" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="830" y="414">Extensions (Wasm)</text>
  </g>
  <text x="800" y="490" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#a39a93">desired state in, running containers out</text>

  <!-- Outputs -->
  <path d="M1080 270 C 1130 270, 1130 214, 1196 214" fill="none" stroke="#3ecf9e" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1080 374 C 1130 374, 1130 424, 1196 424" fill="none" stroke="#6f9cff" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1132" y="448" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" fill="#6f9cff">mTLS</text>

  <g font-family="IBM Plex Sans">
    <rect x="1204" y="134" width="332" height="164" rx="16" fill="url(#card)" stroke="#3ecf9e" stroke-opacity="0.35"/>
    <text x="1232" y="178" font-weight="600" font-size="22" fill="#f3ece7">This host</text>
    <text x="1232" y="206" font-size="17" fill="#a39a93">Docker, one container per app</text>
    <g transform="translate(1232 228)">
      <rect width="62" height="44" rx="8" fill="#3ecf9e" fill-opacity="0.18" stroke="#3ecf9e" stroke-opacity="0.6"/>
      <rect x="72" width="62" height="44" rx="8" fill="#3ecf9e" fill-opacity="0.18" stroke="#3ecf9e" stroke-opacity="0.6"/>
      <rect x="144" width="62" height="44" rx="8" fill="#3ecf9e" fill-opacity="0.18" stroke="#3ecf9e" stroke-opacity="0.6"/>
      <rect x="216" width="62" height="44" rx="8" fill="#3ecf9e" fill-opacity="0.18" stroke="#3ecf9e" stroke-opacity="0.6"/>
    </g>

    <rect x="1204" y="346" width="332" height="164" rx="16" fill="url(#card)" stroke="#6f9cff" stroke-opacity="0.35"/>
    <text x="1232" y="390" font-weight="600" font-size="22" fill="#f3ece7">Remote nodes</text>
    <text x="1232" y="418" font-size="17" fill="#a39a93">rivet-agent dials out, no open port</text>
    <g transform="translate(1232 440)">
      <rect width="62" height="44" rx="8" fill="#6f9cff" fill-opacity="0.18" stroke="#6f9cff" stroke-opacity="0.6"/>
      <rect x="72" width="62" height="44" rx="8" fill="#6f9cff" fill-opacity="0.18" stroke="#6f9cff" stroke-opacity="0.6"/>
      <rect x="144" width="62" height="44" rx="8" fill="#6f9cff" fill-opacity="0.18" stroke="#6f9cff" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- Guarantees strip -->
  <g font-family="IBM Plex Mono" font-weight="500" font-size="15" fill="#d6cdc6">
    <text x="800" y="588" text-anchor="middle" xml:space="preserve">non-root   ·   read-only root fs   ·   no capabilities   ·   memory, CPU and PID caps</text>
  </g>
</svg>
